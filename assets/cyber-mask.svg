<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente de Consola -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#051a05" />
      <stop offset="100%" stop-color="#020902" />
    </radialGradient>

    <!-- Resplandor Neón Verde -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Patrón de Cuadrícula / Grid de Consola -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff66" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Patrón de Líneas de Escaneo (Scanlines CRT) -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .terminal-text {
      font-family: 'Courier New', Courier, monospace, 'Fira Code';
      fill: #00ff66;
      font-size: 13px;
      letter-spacing: 1.5px;
    }
    .neon-border {
      stroke: #00ff66;
      filter: url(#neonGlow);
    }
    .dim-text {
      fill: #00aa44;
      opacity: 0.8;
    }
    
    /* Animación de Parpadeo del Cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #00ff66;
    }

    /* Animación de la Línea de Escaneo Activa */
    @keyframes scan {
      0% { transform: translateY(0px); }
      100% { transform: translateY(450px); }
    }
    .scan-beam {
      animation: scan 8s linear infinite;
    }
  </style>

  <!-- Fondo base -->
  <rect width="800" height="450" fill="url(#bgGlow)" rx="10" />
  <rect width="800" height="450" fill="url(#grid)" rx="10" />

  <!-- Marco Exterior Neón con Esquinas Futuristas -->
  <g class="neon-border" fill="none" stroke-width="2">
    <!-- Esquinas -->
    <path d="M 30 60 L 30 30 L 60 30" />
    <path d="M 740 30 L 770 30 L 770 60" />
    <path d="M 30 390 L 30 420 L 60 420" />
    <path d="M 740 420 L 770 420 L 770 390" />
    
    <!-- Retícula Central de Objetivo / Escáner Cyber -->
    <circle cx="400" cy="225" r="130" stroke="#00ff66" stroke-opacity="0.2" stroke-dasharray="6 6" stroke-width="1.5" />
    <circle cx="400" cy="225" r="80" stroke="#00ff66" stroke-opacity="0.4" stroke-dasharray="15 5" stroke-width="1" />
    <circle cx="400" cy="225" r="8" fill="#00ff66" fill-opacity="0.6" />
    
    <!-- Ejes de la Diana / Radar -->
    <line x1="400" y1="70" x2="400" y2="380" stroke="#00ff66" stroke-opacity="0.25" stroke-dasharray="4 4" />
    <line x1="240" y1="225" x2="560" y2="225" stroke="#00ff66" stroke-opacity="0.25" stroke-dasharray="4 4" />
  </g>

  <!-- Cabecera Superior (Textos de Consola) -->
  <g class="terminal-text">
    <text x="50" y="55" class="dim-text">KNS://IDENTITY_SCAN</text>
    <text x="50" y="75">SUBJECT: DJLO LITO</text>
    <text x="50" y="95">STATUS: ENCRYPTED</text>

    <text x="580" y="55" class="dim-text">SYS.PROTECT</text>
    <text x="580" y="75">TRACE: DISABLED</text>
    <text x="580" y="95">NODE: 0x7F21</text>
  </g>

  <!-- Bloque Inferior Terminal / Consola de Comandos -->
  <g class="terminal-text">
    <text x="50" y="375" class="dim-text">KAOSNET // CYBER DEFENSE</text>
    <text x="580" y="375">ID: DJLOLITO</text>
    
    <!-- Línea Prompter/Comando -->
    <line x1="50" y1="395" x2="750" y2="395" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1" />
    <text x="290" y="415">[ IDENTITY VERIFIED ]</text>
    <rect x="480" y="403" width="10" height="14" class="cursor" />
  </g>

  <!-- Overlay de Rayado de Pantalla (CRT Scanlines) -->
  <rect width="800" height="450" fill="url(#scanlines)" pointer-events="none" />

  <!-- Haz de Luz / Línea de Escaneo Animada -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00ff66" stroke-width="2" stroke-opacity="0.3" class="scan-beam" pointer-events="none" />
</svg>
