
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
  <title>DJLOLITO System Panel</title>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#081108"/>
      <stop offset="1" stop-color="#020502"/>
    </linearGradient>
    <style>
      text { font-family: monospace; }
      .key { fill: #39ff14; font-weight: bold; font-size: 17px; }
      .value { fill: #c9f7c9; font-size: 17px; }
      .row {
        opacity: 0;
        animation: appear .8s ease-out forwards;
      }
      .pulse { animation: blink 1.5s steps(2) infinite; }
      .scan { animation: sweep 5s linear infinite; }
      @keyframes appear {
        to { opacity: 1; }
      }
      @keyframes blink {
        50% { opacity: .25; }
      }
      @keyframes sweep {
        from { transform: translateY(0); }
        to { transform: translateY(260px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .row, .pulse, .scan { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="10"
        fill="url(#panel)" stroke="#39ff14" stroke-opacity=".8"/>
  <rect x="15" y="15" width="1170" height="300" rx="6"
        fill="none" stroke="#164516"/>

  <text x="35" y="45" fill="#39ff14" font-size="18" font-weight="bold">SYSTEM.INFO</text>
  <text x="1160" y="45" fill="#70a870" font-size="13" text-anchor="end">TERMINAL SESSION</text>
  <path d="M30 60H1170" stroke="#245524"/>

  <text x="40" y="88" fill="#00ff99" font-size="14">SESSION INITIALIZED...</text>

  <g class="row" style="animation-delay:.3s">
    <text x="60" y="130" class="key">USER</text>
    <text x="260" y="130" class="value">djlolito</text>
  </g>

  <g class="row" style="animation-delay:.7s">
    <text x="60" y="165" class="key">FOCUS</text>
    <text x="260" y="165" class="value">Backend / Automation</text>
  </g>

  <g class="row" style="animation-delay:1.1s">
    <text x="60" y="200" class="key">INTERESTS</text>
    <text x="260" y="200" class="value">Systems / Networking</text>
  </g>

  <g class="row" style="animation-delay:1.5s">
    <text x="60" y="235" class="key">MODE</text>
    <text x="260" y="235" class="value">BUILD // AUTOMATE // LEARN</text>
  </g>

  <g class="row" style="animation-delay:1.9s">
    <text x="60" y="270" class="key">STATUS</text>
    <text x="260" y="270" class="value">ONLINE</text>
    <circle cx="360" cy="264" r="5" fill="#39ff14" class="pulse"/>
  </g>

  <g class="scan">
    <rect x="20" y="65" width="1160" height="2" fill="#39ff14" opacity=".3"/>
  </g>
</svg>
