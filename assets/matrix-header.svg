
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>DJLOLITO Matrix Terminal</title>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#020602"/>
      <stop offset="1" stop-color="#081708"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#123012" stroke-width=".6"/>
    </pattern>
    <style>
      .rain {
        font: 18px monospace;
        fill: #39ff14;
        opacity: .7;
        animation: fall 7s linear infinite;
      }
      .title {
        font: bold 54px monospace;
        fill: #39ff14;
        filter: url(#glow);
      }
      .sub {
        font: 17px monospace;
        fill: #c9f7c9;
        letter-spacing: 2px;
      }
      .cursor {
        animation: blink 1s steps(2) infinite;
      }
      .scan {
        animation: sweep 4s linear infinite;
      }
      @keyframes fall {
        from { transform: translateY(-300px); }
        to { transform: translateY(500px); }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes sweep {
        from { transform: translateY(0); }
        to { transform: translateY(300px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rain, .cursor, .scan { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g class="rain">
    <text x="35" y="100">01アイウエオ01カキク</text>
    <text x="110" y="30" style="animation-delay:-2s">システム01タチツテト</text>
    <text x="210" y="180" style="animation-delay:-4s">0101010101ネットワーク</text>
    <text x="320" y="80" style="animation-delay:-1s">コマンドライン010101</text>
    <text x="450" y="20" style="animation-delay:-5s">01ソフトウェア開発</text>
    <text x="570" y="140" style="animation-delay:-3s">0101010101自動化</text>
    <text x="690" y="60" style="animation-delay:-2.5s">01インフラストラクチャ</text>
    <text x="810" y="180" style="animation-delay:-4.5s">01010101システム</text>
    <text x="940" y="10" style="animation-delay:-1.5s">ターミナル010101</text>
    <text x="1080" y="130" style="animation-delay:-3.5s">0101データ</text>
  </g>

  <rect x="25" y="20" width="1150" height="260" rx="8"
        fill="#020602" fill-opacity=".82" stroke="#39ff14" stroke-opacity=".8"/>

  <circle cx="48" cy="43" r="5" fill="#ff5f56"/>
  <circle cx="66" cy="43" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="43" r="5" fill="#27c93f"/>

  <text x="1120" y="47" fill="#70a870" text-anchor="end"
        font-family="monospace" font-size="13">djlolito@system</text>

  <text x="65" y="105" class="sub">root@djlolito:~$ whoami</text>
  <text x="65" y="170" class="title">DJLOLITO</text>
  <text x="65" y="205" class="sub">SYSADMIN // BACKEND // AUTOMATION</text>
  <text x="65" y="244" fill="#00ff99" font-family="monospace" font-size="16">[ SYSTEM ONLINE ]</text>
  <rect x="340" y="227" width="10" height="23" fill="#39ff14" class="cursor"/>

  <g class="scan">
    <rect width="1200" height="2" fill="#39ff14" opacity=".6"/>
  </g>
</svg>
