name: Generate contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Las tarjetas van ANTES que el snake: snk corre en Docker como root y crea
      # dist/ con permisos que el usuario del runner no puede escribir.
      # Si este paso falla, el job se detiene y NO se publica nada:
      # la rama output conserva los SVG anteriores en lugar de borrarlos.
      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_profile_cards.py djlolito dist

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: djlolito
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2339ff14

      - name: Publish snake and cards
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
